<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">CloudRescue dashboard preview</title><desc id="desc">Static synthetic dashboard preview for cloud recovery assurance and ML restore-time forecasting.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">CloudRescue</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.5" fill="#67e8f9">RECOVERY ASSURANCE · HARD DEPENDENCIES · RESTORE-TIME ML</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">RECOVERABILITY</text><text x="68" y="184" font-size="24" font-weight="800" fill="#4ade80">HARD-GATED</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">RESTORE FORECAST</text><text x="343" y="184" font-size="24" font-weight="800" fill="#c4b5fd">RANDOM FOREST</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">OBJECTIVES</text><text x="618" y="184" font-size="24" font-weight="800" fill="#f8fafc">RTO / RPO</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">EVIDENCE MODE</text><text x="893" y="184" font-size="24" font-weight="800" fill="#f8fafc">GAME-DAY READY</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#0b1727" stroke="#29425b"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Recovery dependencies</text><text x="72" y="298" font-size="12" fill="#94a3b8">Missing controls remain hard blockers</text><circle cx="78" cy="343" r="6" fill="#22c55e"/><text x="96" y="348" font-size="14" font-weight="650" fill="#dbeafe">Immutable / cross-account backup survivability</text><circle cx="78" cy="391" r="6" fill="#60a5fa"/><text x="96" y="396" font-size="14" font-weight="650" fill="#dbeafe">Independent KMS and key-recovery path</text><circle cx="78" cy="439" r="6" fill="#a78bfa"/><text x="96" y="444" font-size="14" font-weight="650" fill="#dbeafe">Isolated recovery identity + IaC state</text><circle cx="78" cy="487" r="6" fill="#f59e0b"/><text x="96" y="492" font-size="14" font-weight="650" fill="#dbeafe">DNS / region / pipeline rebuild dependencies</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#0b1727" stroke="#29425b"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Recovery decision stack</text><text x="631" y="298" font-size="12" fill="#94a3b8">Forecasting never overrides recoverability</text><rect x="631" y="333" width="472" height="50" rx="12" fill="#10291f" stroke="#166534"/><text x="650" y="364" font-size="14" font-weight="800" fill="#4ade80">1 · VERIFY HARD DEPENDENCIES</text><rect x="631" y="399" width="472" height="50" rx="12" fill="#171b35" stroke="#6d28d9"/><text x="650" y="430" font-size="14" font-weight="800" fill="#c4b5fd">2 · FORECAST RESTORE DURATION / RTO PRESSURE</text><rect x="631" y="465" width="472" height="50" rx="12" fill="#302410" stroke="#a16207"/><text x="650" y="496" font-size="14" font-weight="800" fill="#fbbf24">3 · VALIDATE WITH HUMAN RECOVERY EXERCISE</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview summarizes synthetic recovery controls and forecast roles; it does not represent production cloud recovery performance.</text></g></svg>